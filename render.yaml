# $0 preview only. Free PostgreSQL expires after 30 days; no paid fallback.
services:
  - type: web
    name: scenesignal-preview
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/Galinsky-Arts/SceneSignal
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm run core:prepare && npm ci --include=dev --ignore-scripts && npm run check
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: scenesignal-accounts-preview
          property: connectionString
      - key: POSTGRES_EXTERNAL_HOST
        value: dpg-dbp5k8k9v7es73am52kg-a.virginia-postgres.render.com
databases:
  - name: scenesignal-accounts-preview
    plan: free
    region: virginia
    postgresMajorVersion: '17'
    databaseName: scenesignal_accounts_preview
    user: scenesignal_accounts_preview_user
    ipAllowList:
      - source: 0.0.0.0/0
        description: Certificate-verified password-authenticated application connections
