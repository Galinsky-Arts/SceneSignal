# $0 preview only. Accounts live in the Galinsky Arts Neon project "scenesignal"
# (fancy-night-72553226, aws-us-east-1, PG 17), not an expiring Render database.
# DATABASE_URL is entered once as a Render secret (sync: false); never committed.
# The former free Render database (dpg-dbp5k8k9v7es73am52kg-a) is no longer
# referenced; its data was copied with scripts/copy-postgres.mjs and the owner
# may delete it (it expires on its own). SCENESIGNAL_COPY_FROM_DATABASE_URL is a
# one-time, unset-after-use variable for that copy and is not part of steady state.
services:
  - type: web
    name: scenesignal-preview
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/Galinsky-Arts/SceneSignal
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm run core:prepare && npm ci --include=dev --ignore-scripts && npm run check
    startCommand: node scripts/render-start.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_INCLUDE
        value: dev
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
