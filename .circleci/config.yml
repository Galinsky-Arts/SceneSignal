version: 2.1

# Retains SceneSignal application checks, roadmap plan, dependency auditing.
jobs:
  complete-ci:
    docker:
      - image: cimg/node:24.19.0
      - image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        environment:
          POSTGRES_USER: scenesignal
          POSTGRES_PASSWORD: scenesignal-test-only
          POSTGRES_DB: scenesignal_test
    environment:
      SCENESIGNAL_TEST_DATABASE_URL: postgres://scenesignal:scenesignal-test-only@127.0.0.1:5432/scenesignal_test
    resource_class: large
    steps:
      - checkout
      - run:
          name: Prepare pinned core from existing toolchain
          command: npm run core:prepare
      - run:
          name: Install locked packages with no dependency scripts
          command: npm ci --ignore-scripts
      - run:
          name: Typecheck, roadmap contracts, full unit tests and build
          command: npm run check
      - run:
          name: Scene session to production C output integration
          command: npm run test:native
      - run:
          name: Real PostgreSQL contribution concurrency and rollback
          command: npm run test:postgres
      - run:
          name: Audit moderate and higher dependency vulnerabilities
          command: npm audit --audit-level=moderate
  planning-check:
    docker:
      - image: cimg/node:24.19.0
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate exact approved roadmap
          command: node scripts/check-roadmap.mjs
workflows:
  all-required-checks:
    jobs:
      - complete-ci
      - planning-check
